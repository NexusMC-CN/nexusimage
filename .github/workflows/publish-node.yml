name: Publish Node Package

on:
  push:
    tags: ['node-v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            packages/browser/package-lock.json
            packages/server/package-lock.json
      - run: npm ci --prefix packages/browser
      - run: npm run build --prefix packages/browser
      - run: npm ci --prefix packages/server
      - name: Verify package version matches tag
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expected = process.env.GITHUB_REF_NAME.slice('node-v'.length);
          const actual = JSON.parse(fs.readFileSync('packages/server/package.json', 'utf8')).version;
          if (actual !== expected) {
            console.error(`package version ${actual} does not match tag ${expected}`);
            process.exit(1);
          }
          NODE
      - run: npm run test:ci --prefix packages/server
      - run: npm publish --provenance --access public
        working-directory: packages/server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
