name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            packages/browser/package-lock.json
            packages/server/package-lock.json
      - run: npm ci --prefix packages/browser
      - run: npm run test:ci --prefix packages/browser
      - run: npm ci --prefix packages/server
      - run: npm run test:ci --prefix packages/server

  browser:
    name: Browser compatibility
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/browser/package-lock.json
      - run: npm ci --prefix packages/browser
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: packages/browser
      - run: npm run test:browser:playwright
        working-directory: packages/browser
